# Configuração central do projeto. Todo caminho é relativo à raiz do repositório.
# Mude valores aqui, nunca dentro do código.

category: bottle

paths:
  data_dir: data/raw/mvtec        # pasta das categorias do MVTec AD (ex.: data/raw/mvtec/bottle/)

image:
  size: 256                       # lado (px) para o qual as imagens são reduzidas
  # Imagens: cv2.INTER_AREA. Máscaras: cv2.INTER_NEAREST (nunca interpolar máscara).

dataset:
  url: "https://www.mydrive.ch/shares/150452/132a93367fb17cdf968dfb5c4013f6e7/download/420937370-1629958698/bottle.tar.xz"
  page: "https://www.mvtec.com/company/research/datasets/mvtec-ad/downloads"
  license: "CC BY-NC-SA 4.0 (uso não comercial)"
  # Contagens esperadas, conferidas por scripts/download_data.py e scripts/check_env.py.
  expected_counts:
    train/good: 209
    test/good: 20
    test/broken_large: 20
    test/broken_small: 22
    test/contamination: 21
    ground_truth/broken_large: 20
    ground_truth/broken_small: 22
    ground_truth/contamination: 21

# Fase 1 — exploração (scripts/run_fase1.py)
exploration:
  ring_px: 6                      # largura (px a 256) do anel ao redor do defeito para medir contraste
  radial_bin: 0.1                 # largura das faixas de raio no perfil de variabilidade
  gallery_per_type: 5             # exemplos por tipo na galeria
  gallery_seed: 0                 # sorteio dos exemplos da galeria

# Fase 2 — partição supervisionada própria (scripts/run_fase2.py)
seed: 0                           # semente única do projeto; mudar = nova partição
partition:
  n_reference: 120                # boas do treino para média e desvio por pixel
  n_calibration: 30               # boas do treino para fixar limiares
  n_dev_per_type: 3               # defeituosas por tipo para ajuste; fora das métricas finais
  cv_splits: 5                    # folds da validação cruzada estratificada
  cv_seeds: [0, 1, 2, 3, 4]       # repetições da validação cruzada

# Fase 3 — alinhamento, referência e baseline (scripts/run_fase3.py)
reference:
  align: true                     # transladar cada garrafa para o centro médio da referência
  roi_frac: 0.95                  # raio da ROI como fração do raio da garrafa (exclui a borda com o fundo)
  eps: 2.0                        # somado ao desvio por pixel no mapa z (níveis de cinza)
  threshold_percentile: 99.5      # limiar = este percentil de z nas imagens de calibração

# Fase 4 — denoising e bordas (scripts/run_fase4.py)
# Candidatos testados. A escolha final vai para a seção `pipeline`, abaixo, depois da análise.
denoise_candidates:
  - {method: none}
  - {method: gaussian, sigma: 1}
  - {method: gaussian, sigma: 2}
  - {method: gaussian, sigma: 3}      # teto: ~1/4 do raio do menor defeito
  - {method: median, ksize: 5}
  - {method: bilateral, d: 9, sigma_color: 30, sigma_space: 3}
decision_tie: 0.01                    # diferenças de AUROC menores que isto = empate -> vence o mais simples
edges:
  grad_eps: 2.0                       # somado ao desvio do gradiente no mapa z do gradiente
  canny_high: 80                      # T_H do Canny (T_L = T_H / razão)
  canny_ratios: [2, 3]                # razões T_H:T_L recomendadas pelo guia
  canny_tolerance_px: 2               # dilatação das bordas da referência (desalinhamento residual)

# Escolhas do pipeline. Cada fase registra aqui o que decidiu; as fases seguintes leem daqui.
pipeline:
  denoise: {method: gaussian, sigma: 2}   # Fase 4: AUROC 0,83 -> 0,89; empate com sigma=3 vence o menor
  normalize_brightness: false             # Fase 4: piora a AUROC e não reduz FP nas boas do teste
  anomaly_map: maximo                     # Fase 4: max(z intensidade, z gradiente Sobel); melhora broken.
                                          #   Custo: ~3x componentes espúrios nas boas (Fase 6 mede)
  anomaly_maps_fase5: [intensidade, maximo]   # Relatório da Fase 4: o Sobel está condicionado, então a Fase 5
                                          #   avalia os dois mapas e a morfologia da Fase 6 decide. Critério:
                                          #   fica o mapa com menos falsos positivos e recall igual ou maior
                                          #   depois da limpeza; se não, volta a `intensidade`
