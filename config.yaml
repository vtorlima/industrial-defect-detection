# Configuração central do projeto. Todo caminho é relativo à raiz do repositório.
# Mude valores aqui, nunca dentro do código.

category: bottle

paths:
  data_dir: data/raw/mvtec        # pasta das categorias do MVTec AD (ex.: data/raw/mvtec/bottle/)

image:
  size: 256                       # lado (px) para o qual as imagens são reduzidas
  # Imagens: cv2.INTER_AREA. Máscaras: cv2.INTER_NEAREST (nunca interpolar máscara).

dataset:
  url: "https://www.mydrive.ch/shares/150452/132a93367fb17cdf968dfb5c4013f6e7/download/420937370-1629958698/bottle.tar.xz"
  page: "https://www.mvtec.com/company/research/datasets/mvtec-ad/downloads"
  license: "CC BY-NC-SA 4.0 (uso não comercial)"
  # Contagens esperadas, conferidas por scripts/download_data.py e scripts/check_env.py.
  expected_counts:
    train/good: 209
    test/good: 20
    test/broken_large: 20
    test/broken_small: 22
    test/contamination: 21
    ground_truth/broken_large: 20
    ground_truth/broken_small: 22
    ground_truth/contamination: 21

# Fase 1 — exploração (scripts/run_fase1.py)
exploration:
  ring_px: 6                      # largura (px a 256) do anel ao redor do defeito para medir contraste
  radial_bin: 0.1                 # largura das faixas de raio no perfil de variabilidade
  gallery_per_type: 5             # exemplos por tipo na galeria
  gallery_seed: 0                 # sorteio dos exemplos da galeria

# Fase 2 — partição supervisionada própria (scripts/run_fase2.py)
seed: 0                           # semente única do projeto; mudar = nova partição
partition:
  n_reference: 120                # boas do treino para média e desvio por pixel
  n_calibration: 30               # boas do treino para fixar limiares
  n_dev_per_type: 3               # defeituosas por tipo para ajuste; fora das métricas finais
  cv_splits: 5                    # folds da validação cruzada estratificada
  cv_seeds: [0, 1, 2, 3, 4]       # repetições da validação cruzada
