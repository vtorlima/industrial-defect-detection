[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdi-defeitos"
version = "0.1.0"
description = "Projeto 4 de PDI: detecção e classificação de defeitos industriais (MVTec AD, categoria bottle) com processamento clássico."
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
